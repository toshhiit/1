<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2c003e, #4b007f);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .error {
            color: #ff4d6d;
        }
    </style>
</head>
<body>
    <h1>Авторизация...</h1>

    <script>
        const API_URL = "https://1-production-5ecb.up.railway.app"; // backend без слеша
        const token = new URLSearchParams(window.location.search).get("token");
        const h1 = document.querySelector("h1");

        if (!token) {
            h1.textContent = "Ошибка: токен не найден";
            h1.classList.add("error");
        } else {
            fetch(`${API_URL}/api/auth/verify`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem("session", data.session);
                    localStorage.setItem("username", data.username);
                    window.location.href = "/index.html";
                } else {
                    h1.textContent = `Ошибка: ${data.error}`;
                    h1.classList.add("error");
                }
            })
            .catch(() => {
                h1.textContent = "Ошибка сервера";
                h1.classList.add("error");
            });
        }
    </script>
</body>
</html>
