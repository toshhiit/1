<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Library Of Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0C0D14; color: #fff; font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { background-color:#212233; padding:2rem; border-radius:1rem; box-shadow:0 10px 30px rgba(0,0,0,0.5); text-align:center; }
    .btn { background-color:#373952; padding:0.5rem 1rem; border-radius:0.5rem; cursor:pointer; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl mb-4">Авторизация...</h1>
    <p id="status">Проверяем токен...</p>
  </div>

  <script>
    async function login() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        document.getElementById("status").textContent = "Токен не найден!";
        return;
      }

      try {
        const res = await fetch("/api/auth/verify", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ token })
        });
        const data = await res.json();

        if (data.success) {
          // сохраняем session_id
          localStorage.setItem("session_id", data.session);
          // редирект на основной сайт
          window.location.href = "/";
        } else {
          document.getElementById("status").textContent = "Ошибка авторизации: " + (data.error || "неизвестная");
        }
      } catch (err) {
        document.getElementById("status").textContent = "Ошибка сети";
        console.error(err);
      }
    }

    login();
  </script>
</body>
</html>
