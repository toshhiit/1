<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация...</title>
</head>
<body>
    <h1>Авторизация...</h1>

    <script>
        // Твой backend Railway
        const API_URL = "1-production-5ecb.up.railway.app";

        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            document.body.innerHTML = "<h1>Ошибка: токен не найден</h1>";
        } else {
            // POST на /api/auth/verify с JSON
            fetch(`${API_URL}/api/auth/verify`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ token })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    // Авторизация успешна → сохраняем сессию и редиректим
                    localStorage.setItem("session_id", data.session);
                    localStorage.setItem("username", data.username);

                    // Редирект на index.html
                    window.location.href = `/index.html`;
                } else {
                    document.body.innerHTML = `<h1>Ошибка: ${data.error}</h1>`;
                }
            })
            .catch(() => {
                document.body.innerHTML = "<h1>Ошибка сервера Railway</h1>";
            });
        }
    </script>
</body>
</html>
