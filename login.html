<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация...</title>
</head>
<body>
    <h1>Авторизация...</h1>

    <script>
        const API_URL = "https://1-production-5ecb.up.railway.app"; // backend без слеша

        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            document.body.innerHTML = "<h1>Ошибка: токен не найден</h1>";
        } else {
            fetch(`${API_URL}/api/auth/verify`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem("session", data.session);
                    localStorage.setItem("username", data.username);
                    window.location.href = "/index.html";
                } else {
                    document.body.innerHTML = `<h1>Ошибка: ${data.error}</h1>`;
                }
            })
            .catch(() => {
                document.body.innerHTML = "<h1>Ошибка сервера</h1>";
            });
        }
    </script>
</body>
</html>
