<style>
/* Layout: шапка с итогом патча → счётчики-фильтры → общие/предметы/крипы → карточки героев по вердиктам */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel-2:#f5f6f8; --fg:#191c22; --muted:#5d6472; --line:#d9dde4;
  --accent:#a8741a; --old:#9aa0ab;
  --nf:#c2412a; --bal:#5a6a85; --bf:#2f8a4e;
  --nf-bg:#fbebe6; --bal-bg:#eceff5; --bf-bg:#e7f4ec;
  --ph-a:#3a4150; --ph-b:#1e232c; --ph-fg:#f1d9a6;
  --display:"Russo One", "Arial Black", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --panel:#1a1e26; --panel-2:#20252f; --fg:#e8eaee; --muted:#9aa2b1; --line:#2c3240;
  --accent:#e0a84a; --old:#6f7684;
  --nf:#ff7b62; --bal:#9fb0cc; --bf:#5fcf86;
  --nf-bg:#3a1f1b; --bal-bg:#232a37; --bf-bg:#18311f;
  --ph-a:#3a4252; --ph-b:#232833; --ph-fg:#f1d9a6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1a1e26; --panel-2:#20252f; --fg:#e8eaee; --muted:#9aa2b1; --line:#2c3240;
  --accent:#e0a84a; --old:#6f7684;
  --nf:#ff7b62; --bal:#9fb0cc; --bf:#5fcf86;
  --nf-bg:#3a1f1b; --bal-bg:#232a37; --bf-bg:#18311f;
  --ph-a:#3a4252; --ph-b:#232833; --ph-fg:#f1d9a6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px;display:flex;flex-direction:column;gap:26px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.lead{max-width:68ch;color:var(--muted);margin:0}
.lead b{color:var(--fg)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.counts{grid-template-columns:repeat(2,1fr)}}
.count{border-radius:10px;padding:10px 12px;background:var(--c-bg);color:var(--c);display:flex;flex-direction:column;gap:2px;border:0;font:inherit;text-align:left;cursor:pointer}
.count .n{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.count .l{font-size:12.5px;font-weight:600}
.count[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c)}
.count:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.v-all{--c:var(--fg);--c-bg:var(--panel)}
.v-nf{--c:var(--nf);--c-bg:var(--nf-bg)} .v-bal{--c:var(--bal);--c-bg:var(--bal-bg)} .v-bf{--c:var(--bf);--c-bg:var(--bf-bg)}
.top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h2{font-size:17px}
.irow{display:flex;gap:10px;align-items:flex-start;min-width:0}
.irow > div{min-width:0;display:flex;flex-direction:column;gap:2px}
.irow h3{margin:0;font-size:14px}
.tools{display:flex;gap:10px}
.tools input{flex:1 1 220px;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit}
.group{display:flex;flex-direction:column;gap:12px}
.ghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--c);padding-bottom:6px}
.ghead h2{color:var(--c)}
.ghead span{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .top{display:flex;align-items:center;gap:10px}
.card .name{flex:1;min-width:0;font-weight:700;font-size:15.5px;line-height:1.2}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--c-bg);color:var(--c);white-space:nowrap}
.blk{display:flex;flex-direction:column;gap:3px}
.blk h4{margin:4px 0 0;font-size:13px}
.chg{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.chg li{padding-left:14px;position:relative;overflow-wrap:anywhere}
.chg li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--line)}
.chg .pk{color:var(--fg)}
.chg .pa{font-family:var(--mono);font-size:12px;color:var(--old);text-decoration:line-through}
.chg .pb{font-family:var(--mono);font-size:12px;color:var(--fg);font-weight:600}
.hero-ico{width:64px;height:36px;border-radius:5px;object-fit:cover;flex:none;background:var(--panel-2)}
.ico{width:44px;height:32px;border-radius:4px;object-fit:cover;flex:none;background:var(--panel-2)}
.ph{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--ph-a),var(--ph-b));color:var(--ph-fg);font-family:var(--display);font-size:13px}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
footer a{color:var(--accent)}
</style>

const V={bf:{t:"Бафф",s:"стали сильнее"},bal:{t:"Сбалансировали",s:"где-то сняли, где-то дали"},nf:{t:"Нерф",s:"стали слабее"}};
const order=["bf","bal","nf"];
const H=Object.entries(A42.heroes);
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function initials(n){return n.replace(/'s\b/g,"").split(/[\s-]+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).join("").slice(0,2)||n.slice(0,2)}
function ico(k,n){return IMG[k]?`<img class="ico" src="${IMG[k]}" alt="${esc(n)}" title="${esc(n)}" width="44" height="32">`:`<span class="ico ph" role="img" aria-label="${esc(n)}">${esc(initials(n))}</span>`}
function heroIco(n){const k=HK[n];return IMG["h_"+k]?`<img class="hero-ico" src="${IMG["h_"+k]}" alt="" width="64" height="36" loading="lazy">`:`<span class="hero-ico ph">${esc(initials(n))}</span>`}
function li(x){return Array.isArray(x)?`<li><span class="pk">${esc(x[0])}</span>: <span class="pa">${esc(x[1])}</span> → <span class="pb">${esc(x[2])}</span></li>`:`<li>${x}</li>`}
const ul=l=>`<ul class="chg">${l.map(li).join("")}</ul>`;
let active=null;
function renderStatic(){
  const c=k=>H.filter(h=>h[1].v===k).length;
  $("#lead").innerHTML=`Небольшой патч после 7.42. Изменены <b>${H.length} героев</b>: ${c("bf")} стали сильнее, ${c("nf")} — слабее, у ${c("bal")} что-то сняли и что-то дали. Ещё правки у <b>Bloodslinger, Eye of Skadi, Horn of Battle и Safety Bubble</b>, у одного нейтрального крипа и две общие механики.`;
  $("#general").innerHTML=A42.general.map(li).join("");
  $("#items").innerHTML=A42.items.map(it=>`<div class="irow">${ico(it.k,it.n)}<div><h3>${esc(it.n)}</h3>${ul(it.l)}</div></div>`).join("");
  $("#creeps").innerHTML=A42.creeps.map(c=>`<div class="blk"><h4 style="margin:0">${esc(c.n)} <span style="font-weight:400;color:var(--muted)">(Чайкосветица)</span></h4>${ul(c.l)}</div>`).join("");
}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  $("#counts").innerHTML=[["all","Все герои",H.length],...order.map(k=>[k,V[k].t,H.filter(h=>h[1].v===k).length])].map(([k,t,n])=>
    `<button type="button" class="count v-${k}" data-k="${k}" aria-pressed="${(active||"all")===k}"><span class="n">${n}</span><span class="l">${t}</span></button>`).join("");
  document.querySelectorAll(".count").forEach(b=>b.onclick=()=>{active=b.dataset.k==="all"||active===b.dataset.k?null:b.dataset.k;render()});
  let html="";
  for(const k of order){
    if(active&&active!==k)continue;
    const list=H.filter(([n,a])=>a.v===k&&(!q||n.toLowerCase().includes(q))).sort((a,b)=>a[0].localeCompare(b[0]));
    if(!list.length)continue;
    html+=`<section class="group v-${k}"><div class="ghead"><h2>${V[k].t}</h2><span>${V[k].s} · ${list.length}</span></div><div class="grid">`+
      list.map(([n,a])=>`<article class="card v-${k}"><div class="top">${heroIco(n)}<span class="name">${esc(n)}</span><span class="tag">${V[k].t}</span></div>${a.b.map(b=>`<div class="blk"><h4>${esc(b.n)}</h4>${ul(b.l)}</div>`).join("")}</article>`).join("")+`</div></section>`;
  }
  $("#board").innerHTML=html||`<p class="empty">Этого героя в 7.42a не меняли. Имя пишется по-английски, например «Lina».</p>`;
}
$("#q").addEventListener("input",render);
renderStatic();render();
</script>
