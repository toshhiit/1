<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Of Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            main: '#0C0D14',
            header: '#212233',
            panel: '#373952',
            card: '#14151e',
            textMain: '#ffffff',
            textMuted: '#b1b6c8',
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
          },
          boxShadow: {
            'glow': '0 0 15px rgba(255, 255, 255, 0.1)',
            'card': '0 14px 30px rgba(0, 0, 0, 0.7)',
            'header': '0 10px 30px rgba(0, 0, 0, 0.45)',
          }
        },
      },
    }
  </script>
  <style>
    body {
      background-color: #0C0D14;
      color: #ffffff;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0C0D14;
    }
    ::-webkit-scrollbar-thumb {
      background: #373952;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4f527a;
    }
  </style>
</head>
<body>
  <header class="p-4 bg-header shadow-header flex justify-between items-center">
    <h1 class="text-xl font-bold">Library Of Games</h1>
    <div>Привет, <span id="username">гость</span>!</div>
  </header>

  <main class="p-4">
    <p>Добро пожаловать в библиотеку игр! Здесь будут твои игры и статистика.</p>
    <!-- Тут можно добавлять список игр, карточки и т.д. -->
  </main>

  <script>
    // Проверка сессии
    window.addEventListener("DOMContentLoaded", async () => {
      const session_id = localStorage.getItem("session_id");
      if (!session_id) {
        // если сессии нет — редирект на login.html
        location.href = "/login";
        return;
      }

      try {
        const res = await fetch(`/api/user?session=${session_id}`);
        const data = await res.json();

        if (data.success) {
          document.getElementById("username").textContent = data.username;
        } else {
          // если сессия устарела — чистим и редирект
          localStorage.removeItem("session_id");
          location.href = "/login";
        }
      } catch (err) {
        console.error("Ошибка при проверке сессии:", err);
        localStorage.removeItem("session_id");
        location.href = "/login";
      }
    });
  </script>
</body>
</html>
