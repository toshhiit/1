<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Of Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { main: '#0C0D14', header: '#212233', panel: '#373952', card: '#14151e', textMain: '#ffffff', textMuted: '#b1b6c8' },
          boxShadow: { glow: '0 0 15px rgba(255,255,255,0.1)', card: '0 14px 30px rgba(0,0,0,0.7)', header: '0 10px 30px rgba(0,0,0,0.45)' }
        }
      }
    };
  </script>
  <style>
    body { background-color: #0C0D14; color: #ffffff; }
    ::-webkit-scrollbar { width: 8px; background: #0C0D14; }
    ::-webkit-scrollbar-thumb { background: #373952; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ✅ ТОЛЬКО React UMD — НИЧЕГО БОЛЬШЕ -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <script>
    // ✅ ВСЁ ТВОЁ ПРИЛОЖЕНИЕ ЗДЕСЬ — БЕЗ ИМПОРТОВ
    const GAMES = [
      { id: '1', name: '2048', image: 'https://picsum.photos/seed/2048game/300/300', category: 'single' },
      { id: '2', name: 'Snake', image: 'https://picsum.photos/seed/snakegame/300/300', category: 'single' },
      { id: '3', name: 'Dino Run', image: 'https://picsum.photos/seed/dinorun/300/300', category: 'single' },
      { id: '4', name: 'Clicker', image: 'https://picsum.photos/seed/clicker/300/300', category: 'single' },
      { id: '5', name: 'Шашки', image: 'https://picsum.photos/seed/checkers/300/300', category: 'multi' },
      { id: '6', name: 'Сапёр', image: 'https://picsum.photos/seed/minesweeper/300/300', category: 'single' },
      { id: '7', name: 'Пасьянс', image: 'https://picsum.photos/seed/solitaire/300/300', category: 'single' },
      { id: '8', name: 'Tetris', image: 'https://picsum.photos/seed/tetris/300/300', category: 'single' },
      { id: '9', name: 'Paint', image: 'https://picsum.photos/seed/paint/300/300', category: 'multi' }
    ];

    function App() {
      const [coins, setCoins] = React.useState(1500);
      
      return React.createElement('div', {
        className: 'min-h-screen bg-main text-textMain p-8'
      }, [
        // ШАПКА
        React.createElement('header', {
          key: 'header',
          className: 'sticky top-0 bg-header p-6 shadow-header mb-10 rounded-b-2xl'
        }, [
          React.createElement('h1', {
            key: 'title',
            className: 'text-4xl md:text-5xl font-bold text-center mb-2'
          }, 'Library Of Games'),
          React.createElement('div', {
            key: 'coins',
            className: 'flex items-center justify-center gap-2 bg-panel px-4 py-2 rounded-full max-w-max mx-auto'
          }, [
            React.createElement('div', {
              key: 'coin-icon',
              className: 'w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center text-black font-bold text-sm'
            }, '$'),
            React.createElement('span', { key: 'coin-count', className: 'text-2xl font-bold' }, coins),
            React.createElement('button', {
              key: 'add-coins',
              className: 'w-10 h-10 bg-green-500 rounded-full flex items-center justify-center hover:bg-green-400 transition-all ml-2',
              onClick: () => setCoins(c => c + 100)
            }, '+')
          ])
        ]),
        
        // ОСНОВНОЙ КОНТЕНТ
        React.createElement('main', {
          key: 'main',
          className: 'max-w-6xl mx-auto'
        }, [
          React.createElement('h2', {
            key: 'title2',
            className: 'text-3xl md:text-4xl font-bold mb-10 text-center'
          }, 'МИНИ ИГРЫ'),
          
          React.createElement('div', {
            key: 'games-grid',
            className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8'
          }, GAMES.map(game => React.createElement('div', {
            key: game.id,
            className: 'group bg-panel hover:bg-card rounded-2xl p-6 shadow-glow hover:shadow-card transition-all cursor-pointer border border-white/5 hover:border-yellow-400/50',
            onClick: () => alert(`🚀 Запуск игры: ${game.name}`)
          }, [
            React.createElement('div', {
              key: 'image-wrapper',
              className: 'w-full h-48 rounded-xl overflow-hidden mb-6 bg-white/5 group-hover:scale-105 transition-transform'
            }, React.createElement('img', {
              src: game.image,
              alt: game.name,
              className: 'w-full h-full object-cover'
            })),
            React.createElement('h3', {
              key: 'name',
              className: 'text-xl font-bold mb-3 group-hover:text-yellow-400 transition-colors'
            }, game.name),
            React.createElement('p', {
              key: 'desc',
              className: 'text-textMuted text-sm leading-relaxed'
            }, game.description || 'Классическая игра на все времена')
          ])))
        ])
      ]);
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(React.StrictMode, null, React.createElement(App)));
  </script>
</body>
</html>
