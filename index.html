<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Of Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { main: '#0C0D14', header: '#212233', panel: '#373952', card: '#14151e', textMain: '#ffffff', textMuted: '#b1b6c8' },
          boxShadow: { glow: '0 0 15px rgba(255,255,255,0.1)', card: '0 14px 30px rgba(0,0,0,0.7)', header: '0 10px 30px rgba(0,0,0,0.45)' }
        }
      }
    };
  </script>
  <style>
    body { background-color: #0C0D14; color: #ffffff; }
    ::-webkit-scrollbar { width: 8px; background: #0C0D14; }
    ::-webkit-scrollbar-thumb { background: #373952; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <script>
    // Простой рендерер без импортов
    function renderApp() {
      const App = () => React.createElement('div', {
        className: 'min-h-screen bg-main text-textMain p-8 text-center',
        style: { fontFamily: 'system-ui, sans-serif' }
      }, [
        React.createElement('h1', { key: 'title', className: 'text-4xl font-bold mb-8' }, 'Library Of Games'),
        React.createElement('p', { key: 'text' }, 'Все компоненты работают!')
      ]);
      
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(React.StrictMode, null, React.createElement(App)));
    }
    
    renderApp();
  </script>
</body>
</html>
